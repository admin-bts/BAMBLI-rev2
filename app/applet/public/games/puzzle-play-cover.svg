      <!-- Row 1 -->
      <rect x="0" y="0" width="44" height="44" rx="8" fill="#4ECDC4" stroke="#000" stroke-width="2.5"/>
      <text x="22" y="29" fill="#000">B</text>
      <rect x="50" y="0" width="44" height="44" rx="8" fill="#4ECDC4" stroke="#000" stroke-width="2.5"/>
      <text x="72" y="29" fill="#000">A</text>
      <rect x="100" y="0" width="44" height="44" rx="8" fill="#4ECDC4" stroke="#000" stroke-width="2.5"/>
      <text x="122" y="29" fill="#000">M</text>
      <rect x="150" y="0" width="44" height="44" rx="8" fill="#4ECDC4" stroke="#000" stroke-width="2.5"/>
      <text x="172" y="29" fill="#000">B</text>
      <rect x="200" y="0" width="44" height="44" rx="8" fill="#4ECDC4" stroke="#000" stroke-width="2.5"/>
      <text x="222" y="29" fill="#000">L</text>

      <!-- Row 2 -->
      <rect x="0" y="50" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="22" y="79" fill="#000">O</text>
      <rect x="50" y="50" width="44" height="44" rx="8" fill="#FF6B6B" stroke="#000" stroke-width="2.5"/>
      <text x="72" y="79" fill="#FFF">L</text>
      <rect x="100" y="50" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="122" y="79" fill="#000">I</text>
      <rect x="150" y="50" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="172" y="79" fill="#000">O</text>
      <rect x="200" y="50" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="222" y="79" fill="#000">N</text>

      <!-- Row 3 -->
      <rect x="0" y="100" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="22" y="129" fill="#000">R</text>
      <rect x="50" y="100" width="44" height="44" rx="8" fill="#FF6B6B" stroke="#000" stroke-width="2.5"/>
      <text x="72" y="129" fill="#FFF">I</text>
      <rect x="100" y="100" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="122" y="129" fill="#000">F</text>
      <rect x="150" y="100" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="172" y="129" fill="#000">O</text>
      <rect x="200" y="100" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="222" y="129" fill="#000">X</text>

      <!-- Row 4 -->
      <rect x="0" y="150" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="22" y="179" fill="#000">O</text>
      <rect x="50" y="150" width="44" height="44" rx="8" fill="#FF6B6B" stroke="#000" stroke-width="2.5"/>
      <text x="72" y="179" fill="#FFF">O</text>
      <rect x="100" y="150" width="44" height="44" rx="8" fill="#8AC926" stroke="#000" stroke-width="2.5"/>
      <text x="122" y="179" fill="#FFF">S</text>
      <rect x="150" y="150" width="44" height="44" rx="8" fill="#8AC926" stroke="#000" stroke-width="2.5"/>
      <text x="172" y="179" fill="#FFF">T</text>
      <rect x="200" y="150" width="44" height="44" rx="8" fill="#8AC926" stroke="#000" stroke-width="2.5"/>
      <text x="222" y="179" fill="#FFF">A</text>

      <!-- Row 5 -->
      <rect x="0" y="200" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="22" y="229" fill="#000">C</text>
      <rect x="50" y="200" width="44" height="44" rx="8" fill="#FF6B6B" stroke="#000" stroke-width="2.5"/>
      <text x="72" y="229" fill="#FFF">N</text>
      <rect x="100" y="200" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="122" y="229" fill="#000">K</text>
      <rect x="150" y="200" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="172" y="229" fill="#000">E</text>
      <rect x="200" y="200" width="44" height="44" rx="8" fill="#FFFDF0" stroke="#000" stroke-width="2.5"/>
      <text x="222" y="229" fill="#000">T</text>
