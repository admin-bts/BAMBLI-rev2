<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="50%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#FFFDF0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000"/>
    </filter>
    <filter id="boldShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#warmBg)"/>

  <!-- Decorative Word Search Grid Pattern in background -->
  <g opacity="0.15" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#000">
    <text x="40" y="80">B A M B L I P U Z Z L E</text>
    <text x="40" y="140">W O R D S E A R C H Q K</text>
    <text x="40" y="200">A D V E N T U R E T R M</text>
    <text x="40" y="260">S T A R P L A Y F U N X</text>
    <text x="40" y="320">T I G E R M O N K E Y L</text>
    <text x="40" y="380">S P A C E R O C K E T P</text>
    <text x="40" y="440">H A I W A N O R E N A B</text>
  </g>

  <!-- Interactive Puzzle Grid Illustration (Right side) -->
  <g transform="translate(480, 110)" filter="url(#boldShadow)">
    <rect x="0" y="0" width="280" height="280" rx="24" fill="#FFF" stroke="#000" stroke-width="5"/>
