    </text>
  </g>

  <!-- 5 Categories Grid -->
  <g transform="translate(40, 315)">
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="32" rx="10" fill="#4ECDC4" stroke="#000" stroke-width="2.5"/>
      <text x="60" y="21" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#000" text-anchor="middle">
        🦁 Animals
      </text>
    </g>
    <g transform="translate(130, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="130" height="32" rx="10" fill="#FFD93D" stroke="#000" stroke-width="2.5"/>
      <text x="65" y="21" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#000" text-anchor="middle">
        🍎 Fruits &amp; Food
      </text>
    </g>
    <g transform="translate(270, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="130" height="32" rx="10" fill="#8AC926" stroke="#000" stroke-width="2.5"/>
      <text x="65" y="21" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFF" text-anchor="middle">
        🚀 Space &amp; Sky
      </text>
    </g>

    <g transform="translate(0, 42)" filter="url(#shadow)">
      <rect x="0" y="0" width="160" height="32" rx="10" fill="#70D6FF" stroke="#000" stroke-width="2.5"/>
      <text x="80" y="21" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#000" text-anchor="middle">
        🌊 Nature &amp; Ocean
      </text>
    </g>
    <g transform="translate(170, 42)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="32" rx="10" fill="#FF7096" stroke="#000" stroke-width="2.5"/>
      <text x="90" y="21" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFF" text-anchor="middle">
        🚗 Vehicles &amp; Adventure
      </text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(40, 420)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="34" rx="10" fill="#191A23" stroke="#000" stroke-width="3"/>
    <text x="200" y="22" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFF" text-anchor="middle">
      EASY TO ADVANCED • 100% KID SAFE • OFFLINE PLAY
    </text>
  </g>
</svg>
