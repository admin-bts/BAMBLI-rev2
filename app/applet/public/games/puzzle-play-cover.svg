    <rect x="0" y="0" width="420" height="115" rx="24" fill="#8054C2" stroke="#000" stroke-width="5"/>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFF">
      Puzzle Play
