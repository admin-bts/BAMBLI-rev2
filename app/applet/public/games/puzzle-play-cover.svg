    <g transform="translate(24, 68)">
      <rect x="0" y="0" width="340" height="34" rx="10" fill="#FFD93D" stroke="#000" stroke-width="3"/>
      <text x="170" y="23" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#000" text-anchor="middle" letter-spacing="0.5">
        WORD SEARCH ADVENTURES
      </text>
