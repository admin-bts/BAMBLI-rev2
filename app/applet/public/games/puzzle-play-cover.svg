  <g transform="translate(40, 215)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="38" rx="12" fill="#FF8E3C" stroke="#000" stroke-width="3.5"/>
    <text x="140" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#FFF" text-anchor="middle">
