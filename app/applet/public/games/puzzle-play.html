let state = {
  screen: 'categories', // 'categories' | 'puzzles' | 'game'
  currentCategory: null,
  currentPuzzle: null,
  generated: null,
  foundWords: [],
  hintsUsed: 0
};

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'categories') {
    app.innerHTML = \`
      <div style="text-align:center; margin-bottom: 12px;">
        <h1 style="font-size: 24px; color: var(--bambli-purple); font-weight: 900;">Bambli Puzzle Play</h1>
        <p style="font-size: 13px; color: #666; font-weight: 700;">Big Learning for Little Minds (Ages 3–7)</p>
      </div>
      <div class="category-grid">
        \${CATEGORIES.map(c => \`
          <div class="cat-card" style="border-color: \${c.color}; background: \${c.bgLight};" onclick="selectCategory('\${c.id}')">
            <div style="font-size: 32px; margin-bottom: 4px;">\${c.icon}</div>
            <div style="font-size: 16px; font-weight: 900; color: \${c.color};">\${c.name}</div>
            <div style="font-size: 11px; font-weight: 700; color: #666; margin-top: 4px;">5 Puzzles</div>
          </div>
        \`).join('')}
      </div>
    \`;
  } else if (state.screen === 'puzzles') {
    const cat = state.currentCategory;
    app.innerHTML = \`
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <button class="btn" style="padding: 6px 12px; font-size: 13px;" onclick="goHome()">⬅ Back</button>
        <h2 style="font-size: 18px; font-weight: 900; color: \${cat.color};">\${cat.icon} \${cat.name}</h2>
        <div style="width: 50px;"></div>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
        \${cat.puzzles.map((p, idx) => {
          const isDone = !!progress.completed[p.id];
          return \`
            <div class="card" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer;" onclick="startPuzzle('\${p.id}')">
              <div>
                <div style="font-size: 16px; font-weight: 900;">\${p.title}</div>
                <div style="font-size: 12px; font-weight: 700; color: #888;">\${p.difficulty.toUpperCase()} • \${p.words.length} Words</div>
              </div>
              <div style="font-size: 18px;">\${isDone ? '⭐ Done' : '▶ Play'}</div>
            </div>
          \`;
        }).join('')}

  } else if (state.screen === 'game') {

      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">

function generateGrid(p) {
  const size = p.gridSize;
  const grid = Array(size).fill(0).map(() => Array(size).fill(''));
  const placedWords = [];
  const words = [...p.words].sort((a,b) => b.length - a.length);

  words.forEach((word, idx) => {
    let placed = false;
    for (let tries = 0; tries < 40 && !placed; tries++) {
      const isHoriz = Math.random() > 0.5;
      const maxR = isHoriz ? size - 1 : size - word.length;
      const maxC = isHoriz ? size - word.length : size - 1;
      const r = Math.floor(Math.random() * (maxR + 1));
      const c = Math.floor(Math.random() * (maxC + 1));

      let canPlace = true;
      for (let i = 0; i < word.length; i++) {
        const cr = isHoriz ? r : r + i;
        const cc = isHoriz ? c + i : c;
        if (grid[cr][cc] !== '' && grid[cr][cc] !== word[i]) {
          canPlace = false; break;
        }
      }
      if (canPlace) {
        const cells = [];
        for (let i = 0; i < word.length; i++) {
          const cr = isHoriz ? r : r + i;
          const cc = isHoriz ? c + i : c;
          grid[cr][cc] = word[i];
          cells.push({ row: cr, col: cc });
        }
        placedWords.push({ word, cells, colorIdx: idx % 6 });
        placed = true;
      }
    }
  });

  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
    }
  }
  return { grid, size, words, placedWords };
}

function setupBoardEvents() {
  const board = document.getElementById('board');
  if (!board) return;
  let isDown = false;
  let start = null;
  let selected = [];

  function getCell(x, y) {
    const el = document.elementFromPoint(x, y);
    if (el && el.dataset && el.dataset.r !== undefined) {
      return { r: parseInt(el.dataset.r), c: parseInt(el.dataset.c) };
    }
    return null;
  }

  function getLine(p1, p2) {
    const dr = p2.r - p1.r;
    const dc = p2.c - p1.c;
    const steps = Math.max(Math.abs(dr), Math.abs(dc));
    if (steps === 0) return [p1];
    const sr = dr / steps;
    const sc = dc / steps;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      pts.push({ r: Math.round(p1.r + i * sr), c: Math.round(p1.c + i * sc) });
    }

    document.querySelectorAll('.grid-cell').forEach(el => {

      const c = parseInt(el.dataset.c);
      el.className = 'grid-cell';
      state.foundWords.forEach(fw => {
        if (fw.cells.some(cell => cell.row === r && cell.col === c)) {
          el.classList.add('found-' + fw.colorIdx);
        }
      });
      if (selected.some(cell => cell.r === r && cell.c === c)) {
        el.classList.add('selected');
      }
    });
  }

  board.onpointerdown = (e) => {
    e.preventDefault();
    const cell = getCell(e.clientX, e.clientY);
    if (cell) {
      isDown = true;
      start = cell;
      selected = [cell];

    }

    if (!isDown || !start) return;
    const cell = getCell(e.clientX, e.clientY);

      selected = getLine(start, cell);
      if (selected.length !== prevLen) sfx.chime(selected.length);
      updateVisuals();
    }
  };

  window.onpointerup = () => {
    if (!isDown) return;
    isDown = false;
    if (selected.length >= 2) {

      const rev = [...selected].reverse().map(p => state.generated.grid[p.r][p.c]).join('');

      if (match && !state.foundWords.some(fw => fw.word === match.word)) {

        sfx.success();
        sfx.speak(match.word);
        if (state.foundWords.length === state.generated.words.length) {

    selected = [];
    updateVisuals();
  };

}

        <button class="btn btn-green" style="width: 100%;" onclick="goCategory()">Next Puzzle ➔</button>
      </div>
    </div>
  \`;

window.useHint = function() {

  if (remaining.length > 0) {

    sfx.chime(5);
    const target = remaining[0];
    const firstCell = target.cells[0];
    const el = document.getElementById('cell-' + firstCell.row + '-' + firstCell.col);
    if (el) {
      el.style.outline = '4px solid var(--bambli-pink)';
      setTimeout(() => el.style.outline = '', 2000);
    }
  }
};
