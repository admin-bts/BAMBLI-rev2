<style>
  :root {
    --bambli-purple: #7C4DB3;
    --bambli-pink: #F06B98;
    --bambli-teal: #43B9B0;
    --bambli-yellow: #F8B92E;
    --bambli-green: #76C943;
    --bambli-lavender: #B9A8DA;
    --bambli-sky: #9CCBEA;
    --bambli-cream: #FFF9E9;
    --bambli-navy: #18345D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: var(--bambli-cream); color: var(--bambli-navy); min-height: 100vh; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
  .header { width: 100%; max-width: 600px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .logo-title { font-size: 20px; font-weight: 900; color: var(--bambli-purple); display: flex; align-items: center; gap: 8px; }
  .star-badge { background: #FFF; border: 2px solid var(--bambli-yellow); padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 13px; color: var(--bambli-navy); }
  .container { width: 100%; max-width: 500px; padding: 12px; flex: 1; display: flex; flex-direction: column; align-items: center; }
  .card { background: #FFF; border-radius: 24px; border: 3px solid var(--bambli-lavender); box-shadow: 0 8px 24px rgba(124,77,179,0.12); width: 100%; padding: 16px; margin-bottom: 12px; }
  .btn { background: var(--bambli-purple); color: #FFF; border: none; border-radius: 16px; font-weight: 800; font-size: 15px; padding: 12px 20px; cursor: pointer; transition: transform 0.1s; }
  .btn:active { transform: scale(0.96); }
  .btn-green { background: var(--bambli-green); }
  .btn-pink { background: var(--bambli-pink); }
  .grid-board { display: grid; gap: 6px; background: #FFF; border: 4px solid var(--bambli-lavender); border-radius: 24px; padding: 12px; width: 100%; aspect-ratio: 1/1; touch-action: none; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  .grid-cell { background: #FAF7F0; border: 2px solid #E9E3D3; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: var(--bambli-navy); }
  .grid-cell.selected { background: var(--bambli-yellow); border-color: #E5A315; transform: scale(1.05); }
  .grid-cell.found-0 { background: var(--bambli-pink); color: #FFF; border-color: var(--bambli-pink); }
  .grid-cell.found-1 { background: var(--bambli-teal); color: #FFF; border-color: var(--bambli-teal); }
  .grid-cell.found-2 { background: var(--bambli-purple); color: #FFF; border-color: var(--bambli-purple); }
  .grid-cell.found-3 { background: var(--bambli-yellow); color: var(--bambli-navy); border-color: #E5A315; }
  .grid-cell.found-4 { background: var(--bambli-green); color: #FFF; border-color: var(--bambli-green); }
  .grid-cell.found-5 { background: var(--bambli-sky); color: var(--bambli-navy); border-color: var(--bambli-sky); }
  .chips-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .word-chip { background: #FFF; border: 2px solid var(--bambli-lavender); padding: 6px 12px; border-radius: 14px; font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .word-chip.found { text-decoration: line-through; border-color: var(--bambli-green); color: var(--bambli-green); }
  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
  .cat-card { background: #FFF; border-radius: 20px; padding: 14px; border: 3px solid; cursor: pointer; text-align: center; }
  .cat-card:active { transform: scale(0.97); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(24,52,93,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal { background: #FFF; border-radius: 28px; border: 4px solid var(--bambli-yellow); padding: 24px; max-width: 400px; width: 100%; text-align: center; }
</style>
</head>

// Audio Synthesizer
class Sound {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  pop(freq = 440) {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  }
  chime(step = 0) {
    this.init();
    if (!this.ctx) return;
    const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(notes[Math.min(step, notes.length - 1)] || 440, this.ctx.currentTime);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
  }
  success() {
    this.init();
    if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.06);
      g.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.06 + 0.2);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.06);
      osc.stop(this.ctx.currentTime + i * 0.06 + 0.2);
    });
  }
  victory() {
    this.init();
    if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.1);
      g.gain.setValueAtTime(0.25, this.ctx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.1 + 0.35);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.1);
      osc.stop(this.ctx.currentTime + i * 0.1 + 0.35);
    });
  }
  speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.toLowerCase());
      u.rate = 0.85; u.pitch = 1.25;
      window.speechSynthesis.speak(u);
    }
  }
}
const sfx = new Sound();

// Local Storage Progress
let progress = JSON.parse(localStorage.getItem('bambli_progress') || '{"stars":0,"completed":{}}');
function saveProgress() {
  localStorage.setItem('bambli_progress', JSON.stringify(progress));
  const el = document.getElementById('starCount');
  if (el) el.innerText = '⭐ ' + progress.stars + ' Stars';
}
saveProgress();

let state = {
  screen: 'categories', // 'categories' | 'puzzles' | 'game'
  currentCategory: null,
  currentPuzzle: null,
  generated: null,
  foundWords: [],
  hintsUsed: 0
};

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (state.screen === 'categories') {
    app.innerHTML = `
      <div style="text-align:center; margin-bottom: 12px;">
        <h1 style="font-size: 24px; color: var(--bambli-purple); font-weight: 900;">Bambli Puzzle Play</h1>
        <p style="font-size: 13px; color: #666; font-weight: 700;">Big Learning for Little Minds (Ages 3–7)</p>
      </div>
      <div class="category-grid">
        ${CATEGORIES.map(c => `
          <div class="cat-card" style="border-color: ${c.color}; background: ${c.bgLight};" onclick="selectCategory('${c.id}')">
            <div style="font-size: 32px; margin-bottom: 4px;">${c.icon}</div>
            <div style="font-size: 16px; font-weight: 900; color: ${c.color};">${c.name}</div>
            <div style="font-size: 11px; font-weight: 700; color: #666; margin-top: 4px;">5 Puzzles</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (state.screen === 'puzzles') {
    const cat = state.currentCategory;
    app.innerHTML = `
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <button class="btn" style="padding: 6px 12px; font-size: 13px;" onclick="goHome()">⬅ Back</button>
        <h2 style="font-size: 18px; font-weight: 900; color: ${cat.color};">${cat.icon} ${cat.name}</h2>
        <div style="width: 50px;"></div>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
        ${cat.puzzles.map((p, idx) => {
          const isDone = !!progress.completed[p.id];
          return `
            <div class="card" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer;" onclick="startPuzzle('${p.id}')">
              <div>
                <div style="font-size: 16px; font-weight: 900;">${p.title}</div>
                <div style="font-size: 12px; font-weight: 700; color: #888;">${p.difficulty.toUpperCase()} • ${p.words.length} Words</div>
              </div>
              <div style="font-size: 18px;">${isDone ? '⭐ Done' : '▶ Play'}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  } else if (state.screen === 'game') {
    const p = state.currentPuzzle;
    const g = state.generated;
    app.innerHTML = `
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <button class="btn" style="padding: 6px 12px; font-size: 13px;" onclick="goCategory()">⬅ Puzzles</button>
        <h3 style="font-size: 16px; font-weight: 900;">${p.title}</h3>
        <button class="btn btn-pink" style="padding: 6px 12px; font-size: 13px;" onclick="useHint()">💡 Hint</button>
      </div>

      <div id="board" class="grid-board" style="grid-template-columns: repeat(${g.size}, 1fr);">
        ${g.grid.map((row, r) => row.map((letter, c) => `
          <div class="grid-cell" id="cell-${r}-${c}" data-r="${r}" data-c="${c}">${letter}</div>
        `).join('')).join('')}
      </div>

      <div class="chips-container">
        ${g.words.map((w, idx) => {
          const isFound = state.foundWords.some(fw => fw.word === w);
          const clue = p.clues.find(c => c.word === w) || { icon: '⭐' };
          return `
            <div class="word-chip ${isFound ? 'found' : ''}" onclick="sfx.speak('${w}')">
              <span>${clue.icon}</span>
              <span>${w}</span>
              ${isFound ? '<span>✓</span>' : ''}
            </div>
          `;
        }).join('')}
      </div>
    `;
    setupBoardEvents();
  }
}

window.selectCategory = function(catId) {
  sfx.pop();
  state.currentCategory = CATEGORIES.find(c => c.id === catId);
  state.screen = 'puzzles';
  render();
};

window.goHome = function() { sfx.pop(); state.screen = 'categories'; render(); };
window.goCategory = function() { sfx.pop(); state.screen = 'puzzles'; render(); };

window.startPuzzle = function(puzzleId) {
  sfx.pop();
  const p = state.currentCategory.puzzles.find(x => x.id === puzzleId);
  state.currentPuzzle = p;
  state.foundWords = [];
  state.hintsUsed = 0;
  state.generated = generateGrid(p);
  state.screen = 'game';
  render();
};

function generateGrid(p) {
  const size = p.gridSize;
  const grid = Array(size).fill(0).map(() => Array(size).fill(''));
  const placedWords = [];
  const words = [...p.words].sort((a,b) => b.length - a.length);

  words.forEach((word, idx) => {
    let placed = false;
    for (let tries = 0; tries < 40 && !placed; tries++) {
      const isHoriz = Math.random() > 0.5;
      const maxR = isHoriz ? size - 1 : size - word.length;
      const maxC = isHoriz ? size - word.length : size - 1;
      const r = Math.floor(Math.random() * (maxR + 1));
      const c = Math.floor(Math.random() * (maxC + 1));

      let canPlace = true;
      for (let i = 0; i < word.length; i++) {
        const cr = isHoriz ? r : r + i;
        const cc = isHoriz ? c + i : c;
        if (grid[cr][cc] !== '' && grid[cr][cc] !== word[i]) {
          canPlace = false; break;
        }
      }
      if (canPlace) {
        const cells = [];
        for (let i = 0; i < word.length; i++) {
          const cr = isHoriz ? r : r + i;
          const cc = isHoriz ? c + i : c;
          grid[cr][cc] = word[i];
          cells.push({ row: cr, col: cc });
        }
        placedWords.push({ word, cells, colorIdx: idx % 6 });
        placed = true;
      }
    }
  });

  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
    }
  }
  return { grid, size, words, placedWords };
}

function setupBoardEvents() {
  const board = document.getElementById('board');
  if (!board) return;
  let isDown = false;
  let start = null;
  let selected = [];

  function getCell(x, y) {
    const el = document.elementFromPoint(x, y);
    if (el && el.dataset && el.dataset.r !== undefined) {
      return { r: parseInt(el.dataset.r), c: parseInt(el.dataset.c) };
    }
    return null;
  }

  function getLine(p1, p2) {
    const dr = p2.r - p1.r;
    const dc = p2.c - p1.c;
    const steps = Math.max(Math.abs(dr), Math.abs(dc));
    if (steps === 0) return [p1];
    const sr = dr / steps;
    const sc = dc / steps;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      pts.push({ r: Math.round(p1.r + i * sr), c: Math.round(p1.c + i * sc) });
    }
    return pts;
  }

  function updateVisuals() {
    document.querySelectorAll('.grid-cell').forEach(el => {
      const r = parseInt(el.dataset.r);
      const c = parseInt(el.dataset.c);
      el.className = 'grid-cell';
      state.foundWords.forEach(fw => {
        if (fw.cells.some(cell => cell.row === r && cell.col === c)) {
          el.classList.add('found-' + fw.colorIdx);
        }
      });
      if (selected.some(cell => cell.r === r && cell.c === c)) {
        el.classList.add('selected');
      }
    });
  }

  board.onpointerdown = (e) => {
    e.preventDefault();
    const cell = getCell(e.clientX, e.clientY);
    if (cell) {
      isDown = true;
      start = cell;
      selected = [cell];
      sfx.pop(400);
      updateVisuals();
    }
  };

  window.onpointermove = (e) => {
    if (!isDown || !start) return;
    const cell = getCell(e.clientX, e.clientY);
    if (cell) {
      const prevLen = selected.length;
      selected = getLine(start, cell);
      if (selected.length !== prevLen) sfx.chime(selected.length);
      updateVisuals();
    }
  };

  window.onpointerup = () => {
    if (!isDown) return;
    isDown = false;
    if (selected.length >= 2) {
      const fwd = selected.map(p => state.generated.grid[p.r][p.c]).join('');
      const rev = [...selected].reverse().map(p => state.generated.grid[p.r][p.c]).join('');
      const match = state.generated.placedWords.find(pw => pw.word === fwd || pw.word === rev);
      if (match && !state.foundWords.some(fw => fw.word === match.word)) {
        state.foundWords.push(match);
        sfx.success();
        sfx.speak(match.word);
        if (state.foundWords.length === state.generated.words.length) {
          setTimeout(completePuzzle, 500);
        }
      }
    }
    selected = [];
    updateVisuals();
  };

  updateVisuals();
}

function completePuzzle() {
  sfx.victory();
  const earned = state.hintsUsed === 0 ? 3 : 2;
  progress.stars += earned;
  progress.completed[state.currentPuzzle.id] = true;
  saveProgress();

  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML += `
    <div class="modal-overlay">
      <div class="modal">
        <div style="font-size: 40px; margin-bottom: 8px;">🎉 ⭐ ⭐ ⭐</div>
        <h2 style="color: var(--bambli-purple); font-size: 24px; font-weight: 900; margin-bottom: 4px;">You Did It!</h2>
        <p style="font-size: 14px; font-weight: 700; color: #555; margin-bottom: 16px;">Bambli believes in you!</p>
        <button class="btn btn-green" style="width: 100%;" onclick="goCategory()">Next Puzzle ➔</button>
      </div>
    </div>
  `;
}

window.useHint = function() {
  const remaining = state.generated.placedWords.filter(pw => !state.foundWords.some(fw => fw.word === pw.word));
  if (remaining.length > 0) {
    state.hintsUsed++;
    sfx.chime(5);
    const target = remaining[0];
    const firstCell = target.cells[0];
    const el = document.getElementById('cell-' + firstCell.row + '-' + firstCell.col);
    if (el) {
      el.style.outline = '4px solid var(--bambli-pink)';
      setTimeout(() => el.style.outline = '', 2000);
    }
  }
};

render();
</script>
</body>
</html>
